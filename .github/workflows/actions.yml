name: Auto Release Go Module

on:
  push:
    branches:
      - main
      - v4

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important: fetch full history and tags

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: List existing tags
        run: git tag

      - name: Determine next version
        id: version
        run: |
          # The major version is owned by the module path, so each branch releases on its own
          # major line: main -> v5.x.y, the v4 maintenance branch -> v4.x.y.
          major=$(sed -n 's#^module .*/v\([0-9][0-9]*\)$#\1#p' go.mod)
          major=${major:-1}
          echo "Module major version: v$major"

          echo "Fetching latest remote tag for v$major..."
          latest_tag=$(git ls-remote --tags origin \
            | grep -o "refs/tags/v${major}\.[0-9]\+\.[0-9]\+$" \
            | sed 's#refs/tags/##' \
            | sort -Vr \
            | head -n 1)

          if [ -z "$latest_tag" ]; then
            next_version="v${major}.0.0"
          else
            echo "Latest tag: $latest_tag"
            IFS='.' read -r _ minor patch <<< "${latest_tag#v}"
            next_version="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Next version: $next_version"

          echo "tag=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create and push new tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
